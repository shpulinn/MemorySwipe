name: memory_swipe
description: Memory Swipe - relive your photo memories
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Local storage
  hive_flutter: ^1.1.0

  # Photo access
  photo_manager: ^3.6.3

  # UI
  card_swiper: ^3.0.1

  # Sharing
  share_plus: ^10.1.4

  # Открытие настроек приложения
  app_settings: ^5.1.1
  flutter_native_splash: ^2.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/icon/